name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q
      - name: Run synthetic diagnostic controls (not a model benchmark)
        run: python -m evals.unknown_unknown_challenge.run --summary
      - name: Run three-condition agent harness mock smoke test
        run: python -m evals.agent_comparison_experiment.harness --summary
      - name: Verify guarded pilot preflight performs no live calls
        run: python -m evals.agent_comparison_experiment.pilot
      - name: Run guarded pilot offline mock
        run: python -m evals.agent_comparison_experiment.pilot --run-mock --output-dir .pilot-ci-output
      - name: Run local scheduling reference checks
        run: python playground/reference_experience.py --output /tmp/tria-reference-results.json
      - name: Run bounded agentic authority walkthrough
        run: python -c "import sys; sys.path.insert(0, 'playground'); from agentic_experience import run_agentic; assert run_agentic()['passed']"
      - run: python -m build
      - run: python -m pip install --force-reinstall dist/*.whl
      - run: python -c "import tria; assert tria.__version__ == '0.1.0a7'"
