[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tria-sdk"
version = "0.1.0a7"
description = "Model-agnostic governance kernel and runtime boundary for persistent mediated relationships."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Sarasha Elion"}]
license = {text = "MPL-2.0"}
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

dependencies = []

[project.urls]
Repository = "https://github.com/TrivianTechnologies/tria-sdk"
Documentation = "https://github.com/TrivianTechnologies/tria-sdk/blob/main/docs/quickstart.md"
Issues = "https://github.com/TrivianTechnologies/tria-sdk/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "build>=1.2", "jsonschema>=4.23"]

[tool.hatch.build.targets.wheel]
packages = ["src/tria"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
